name: Apply verified progress and synthesis fixes

on:
  push:
    branches: [my/fixes-1.6.2]
    paths: ['.github/fixes-transfer/**']

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-progress-fixes]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODEGRAPH_TELEMETRY: '0'
      DO_NOT_TRACK: '1'
      CODEGRAPH_NO_UPDATE_CHECK: '1'
      CODEGRAPH_NO_DAEMON: '1'
      CODEGRAPH_PARSE_WORKERS: '2'
      CODEGRAPH_RESOLVE_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify and apply exact locally tested patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/my/fixes-1.6.2 | cut -f1)" = "$GITHUB_SHA"
          python - <<'PY'
          import gzip, hashlib, pathlib
          data = bytearray(b''.join(pathlib.Path(f'.github/fixes-transfer/progress-{i}.bin').read_bytes() for i in (1, 2, 3)))
          # Restore one known byte changed by the text-to-binary transfer.
          assert data[1720] == 190
          data[1720] = 142
          patch = gzip.decompress(data)
          assert hashlib.sha256(patch).hexdigest() == '9973b8cfa6aa41938ba6a84e26be5e0b1850c33b15e2bd5231cb8079bd9a77b9'
          pathlib.Path('/tmp/codegraph-progress.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/codegraph-progress.patch
          git apply --index /tmp/codegraph-progress.patch
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 23
          test -z "$(git diff --cached --name-only -- .github)"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify progress and graph correctness
        run: >-
          npx --no-install vitest run --project engine --maxWorkers=2 --minWorkers=1
          __tests__/progress-activity.test.ts
          __tests__/synthesis-optimizations.test.ts
          __tests__/synthesis-progress.test.ts
          __tests__/synthesis-tail-scaling.test.ts
          __tests__/closure-collection-synthesizer.test.ts
          __tests__/fabric-view.test.ts
          __tests__/migrations-synthesis-json.test.ts
          __tests__/sync-rebuild-convergence.test.ts
          __tests__/parse-pool.test.ts
          __tests__/cli-no-color.test.ts
          __tests__/cli-sync.test.ts
          __tests__/workspace-config.test.ts
          __tests__/workspace-discovery.test.ts
          __tests__/default-offline.test.ts
      - name: Publish tested changes without rewriting branch history
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/my/fixes-1.6.2 | cut -f1)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf: accelerate dispatch synthesis and sample live directory progress'
          git push origin HEAD:refs/heads/my/fixes-1.6.2
